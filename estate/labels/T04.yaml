# T04 answer key (evaluation only: factory code must never read this file).
# Format: lansh.estate.labels.JobLabel. Lines are 1-based, in legacy_path.
job_id: T04
legacy_path: estate/tsql/T04_usp_build_claims_summary.sql
summary: >-
  Open-claims summary for claims MI (the vertical slice): one row per claim whose status is
  OPEN or REOPENED and that was reported on or before @AsOfDate, with lob_code normalised
  (UPPER(RTRIM)), status as stored, the policy number from the latest policy snapshot, a
  claim reference, dd/mm/yyyy and yyyymm date texts, days open, and money to date: payments
  (count and total), the latest case reserve per reserve type (indemnity, expense, their
  sum) and incurred. Built through #temp tables. Planted: BUG-03 (payments joined to the
  reserve rows before aggregating, so total_paid and incurred count each payment once per
  reserve type), TSQL-01 and TSQL-02 (the open-status filter ignores case and trailing
  spaces), TSQL-05 (claim_ref built with + is NULL without a handler) and TSQL-16 (CONVERT
  styles 103 and 112 into CHAR(6)). The only other text comparisons are on reserve_type,
  whose data has no case or space variants, so they are labelled unarmed. On our data the
  job writes 823 rows.
traps:
  - trap_id: TSQL-01
    kind: semantic
    armed: true
    lines: [73, 73]
    where: "WHERE   c.status IN ('OPEN', 'REOPENED')"
    effect: >-
      Under the database collation SQL_Latin1_General_CP1_CI_AS the IN list matches status
      values in any case, so the open book includes claims keyed 'Open' (34), 'open' (13)
      and 'Reopened' (2). A naive translation, status.isin('OPEN', 'REOPENED') or the same
      IN in Spark SQL, compares case-sensitively and drops these 49 claims (with TSQL-02,
      60 of the 823 output rows go missing). Exact translation:
      upper(rtrim(status)).isin('OPEN', 'REOPENED'), or a UTF8_LCASE_RTRIM collation, while
      the output keeps status as stored.
    check: T04_TSQL01_status_filter_ignores_case
  - trap_id: TSQL-02
    kind: semantic
    armed: true
    lines: [73, 73]
    where: "WHERE   c.status IN ('OPEN', 'REOPENED')"
    effect: >-
      SQL Server ignores trailing spaces when it compares strings with = (and so with IN),
      so the filter also keeps the 11 claims whose status is stored as 'OPEN ' (5 bytes).
      Spark compares strings exactly, so even a case-insensitive translation
      (upper(status).isin(...), or a UTF8_LCASE collation without RTRIM) drops them. The
      output keeps the stored value 'OPEN ' with its trailing space. Exact translation:
      rtrim the status before comparing (see TSQL-01).
    check: T04_TSQL02_status_filter_ignores_trailing_spaces
  - trap_id: TSQL-05
    kind: semantic
    armed: true
    lines: [136, 136]
    where: "oc.lob_code + '/' + oc.claim_number + '/' + oc.handler_code  (claim_ref)"
    effect: >-
      With + (CONCAT_NULL_YIELDS_NULL ON) the whole claim reference is NULL when
      handler_code is NULL: 109 of the 823 output rows. A translation that uses
      concat_ws, T-SQL CONCAT() semantics (NULL as empty) or coalesce on each part writes
      'HOM/CLM-2021-00193/' instead; format_string writes '.../null' and a Python f-string
      '.../None'. A literal + does not even resolve in Spark SQL (+ is arithmetic only).
      Exact translation: Spark's concat() (or ||), which also returns NULL when any
      argument is NULL.
    check: T04_TSQL05_claim_ref_null_without_handler
  - trap_id: TSQL-16
    kind: semantic
    armed: true
    lines: [143, 143]
    where: "CONVERT(VARCHAR(10), oc.loss_date, 103)  (loss_date_text)"
    effect: >-
      Style 103 is the British/French dd/mm/yyyy. Mapping it to US mm/dd/yyyy (style 101)
      changes 798 of the 823 rows, 293 of which still look like valid dates (day 12 or
      less); ignoring the style and casting the date to text gives yyyy-mm-dd on every
      row. Exact translation: date_format(loss_date, 'dd/MM/yyyy').
    check: T04_TSQL16_convert_style_codes
  - trap_id: TSQL-16
    kind: semantic
    armed: true
    lines: [145, 145]
    where: "CONVERT(CHAR(6), oc.reported_date, 112)  (reported_period)"
    effect: >-
      Style 112 is yyyymmdd; converting into CHAR(6) silently keeps the first six
      characters, yyyymm. A translation that maps style 112 to 'yyyyMMdd' without the
      truncation (or casts the date to text) differs on every one of the 823 rows. Exact
      translation: date_format(reported_date, 'yyyyMM').
    check: T04_TSQL16_convert_style_codes
  - trap_id: TSQL-13
    kind: construct
    armed: true
    lines: [61, 159]
    where: >-
      #open_claims, #reserve and #money, each dropped with IF OBJECT_ID('tempdb..#x') IS
      NOT NULL and built with SELECT ... INTO, then joined by the final INSERT ... SELECT
    effect: >-
      Session temp tables hold the intermediate steps; in Spark they become DataFrames or
      temporary views. No effect on results.
  - trap_id: TSQL-01
    kind: semantic
    armed: false
    lines: [90, 91]
    where: >-
      ROW_NUMBER() OVER (PARTITION BY r.claim_id, r.reserve_type ORDER BY r.reserve_date
      DESC, r.reserve_id DESC)
    effect: >-
      A PARTITION BY on a text column groups case and trailing-space variants together in
      SQL Server but not in Spark. reserve_type holds only 'INDEMNITY' and 'EXPENSE',
      exactly, in our data, so the partitions are the same in both engines. Not armed. The
      ORDER BY ends with the unique reserve_id, so the 24 claim/reserve-type pairs whose
      latest reserve date holds a same-day correction (different amounts) resolve the same
      way in both engines.
  - trap_id: TSQL-01
    kind: semantic
    armed: false
    lines: [106, 107]
    where: >-
      MAX(CASE WHEN r.reserve_type = 'INDEMNITY' THEN r.reserve_amount END), and the same
      for 'EXPENSE'
    effect: >-
      Case-insensitive = on reserve_type; our data has no case or space variants of the
      reserve type, so a case-sensitive comparison picks the same rows. Not armed.
  - trap_id: TSQL-06
    kind: semantic
    armed: false
    lines: [105, 107]
    where: "ISNULL(SUM(p.amount), 0) and ISNULL(MAX(CASE ... END), 0)"
    effect: >-
      ISNULL returns the type of its first argument. Here that is a DECIMAL and the
      replacement is 0, so nothing is truncated or re-typed, and coalesce(..., 0) gives
      the same values (0.00 for a claim with no payments or no reserve of that type). Not
      armed.
  - trap_id: TSQL-04
    kind: semantic
    armed: false
    lines: [146, 146]
    where: "DATEDIFF(DAY, oc.reported_date, @AsOfDate)  (days_open)"
    effect: >-
      DATEDIFF counts the boundaries crossed. With DAY on DATE values each boundary is one
      whole day, so the result equals Spark's datediff(as_of_date, reported_date) on every
      row. Not armed.
bugs:
  - bug_id: BUG-03
    lines: [103, 115]
    where: >-
      SELECT oc.claim_id, COUNT(DISTINCT p.payment_id) AS n_payments, ISNULL(SUM(p.amount),
      0) AS total_paid, ... INTO #money FROM #open_claims oc LEFT JOIN stg.claim_payments p
      ... LEFT JOIN #reserve r ON r.claim_id = oc.claim_id GROUP BY oc.claim_id
    does: >-
      Joins each claim's payments to its current reserve rows (one per reserve type in
      #reserve) in the same query and then aggregates, so SUM(p.amount) counts every
      payment once per reserve type. For claims with both an indemnity and an expense
      reserve, total_paid, and with it incurred, is exactly doubled. COUNT(DISTINCT
      p.payment_id) keeps n_payments right, and MAX picks the right reserve per type, which
      hides the problem. On our data 289 of the 823 claims are over-stated, by EUR
      1,288,029.36 in total: the output reports EUR 4,267,583.98 paid against EUR
      2,979,554.62 actually paid to date.
    intended: >-
      Aggregate payments and reserves separately: total_paid = SUM(amount) of the claim's
      payments up to @AsOfDate (one row per claim), current reserve from #reserve, then
      join the per-claim results, so incurred = paid to date + current reserve.
    check: T04_BUG03_paid_counted_per_reserve_row
