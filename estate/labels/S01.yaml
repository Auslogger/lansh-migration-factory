# S01 claims_enrich.sas -> dw.claims_enriched: planted traps and bug (answer key, evaluation
# only: factory code must never read this file).
# Format: lansh.estate.labels.JobLabel. Lines are 1-based lines of
# estate/sas/S01_claims_enrich.sas. Counts are from the committed data, as at 2025-12-31
# (2,911 output rows: 2,466 claims with payments up to the as-of date, 445 without).
job_id: S01
legacy_path: estate/sas/S01_claims_enrich.sas
summary: >-
  Claim-level payment history for the risk team: one row per claim on the register
  (stg.claims) with its payments up to &as_of. The payments are sorted by claim_id _row_seq
  and rolled up per claim in a DATA step (RETAIN, sum statements, FIRST./LAST.), then merged
  back onto the claims with IN= and a subsetting IF: n_payments, n_recoveries, total_paid,
  the paid split by payment type (indemnity_amt, expense_amt, recovery_amt) built with +,
  gross_paid (+) and net_paid (sum()), first and last payment dates, recovery_flag and
  has_payment, with lob_code and status upper-cased and stripped. Planted: BUG-08 (if
  amount < 0 also counts payments with no amount as recoveries, via SAS-01), SAS-01, SAS-02
  (+ propagates missing amounts where sum() ignores them), SAS-05 (MERGE BY with IN= keeps
  unpaid claims and drops orphan payments) and SAS-06 (first/last payment and running totals
  in _row_seq order). Also labelled: the payment_date filter (SAS-01, unarmed) and the
  FIRST./LAST. construct (SAS-07, unarmed). payment_type, lob_code and status are compared
  or written only after upcase(strip()), so their case and trailing-blank variants behave
  the same in both engines.
traps:
  - trap_id: SAS-01
    kind: semantic
    armed: true
    lines: [73, 73]
    where: "if amount < 0 then do;  (work.pay_summary DATA step)"
    effect: >-
      SAS orders a missing value below every number, so amount < 0 is true for the 86
      payments with no amount up to the as-of date (73 indemnity, 13 expense; on 86
      claims). In Spark NULL < 0 is NULL, which when() and filter() treat as false, so a
      direct translation (F.col('amount') < 0) counts 86 fewer recoveries: n_recoveries
      changes on 86 rows (the output totals 218 against 132 negative amounts) and
      recovery_flag on 81. It silently fixes BUG-08 and fails reconciliation. Exact
      translation: amount.isNull() | (amount < 0).
    check: S01_SAS01_missing_lt_zero
  - trap_id: SAS-01
    kind: semantic
    armed: false
    lines: [36, 36]
    where: "where=(payment_date <= &as_of) on stg.claim_payments, feeding proc sort"
    effect: >-
      A WHERE comparison also treats a missing value as smaller than any number, so a
      missing payment_date would pass payment_date <= &as_of in SAS and fail in Spark.
      payment_date is never missing in our data (NOT NULL in the extract), so both engines
      keep the same 10,225 of the 10,247 payments. Not armed.
  - trap_id: SAS-02
    kind: semantic
    armed: true
    lines: [68, 70]
    where: >-
      if ptype = 'INDEMNITY' then indemnity_amt = indemnity_amt + amount; else if ptype =
      'EXPENSE' then expense_amt = expense_amt + amount; else if ptype = 'RECOVERY' then
      recovery_amt = recovery_amt + amount;  (retained, reset to 0 at first.claim_id)
    effect: >-
      Added up with the + operator, a component turns missing at the first payment with no
      amount and stays missing for the rest of the claim: indemnity_amt is missing on 73
      claims and expense_amt on 13 (recovery amounts are always keyed, so recovery_amt
      never is). A grouped Spark sum (sum(when(type = 'INDEMNITY', amount))) skips the
      NULLs and returns a value on 76 of those 86 claims (on the other 10 every amount of
      that type is missing). Exact translation: NULL when any amount of that type up to
      the as-of date is NULL, otherwise the sum (0 when the claim has none of that type).
    check: S01_SAS02_plus_vs_sum
  - trap_id: SAS-02
    kind: semantic
    armed: true
    lines: [103, 104]
    where: >-
      gross_paid = indemnity_amt + expense_amt; net_paid = sum(indemnity_amt, expense_amt,
      recovery_amt);
    effect: >-
      + propagates a missing value; the sum() function ignores missing arguments (and is
      missing only when all of them are). gross_paid is missing on the 86 paid claims with
      an unkeyed indemnity or expense payment (and on the 445 unpaid claims), while
      net_paid has a value on every one of the 2,466 paid claims (on the 86 it leaves out
      the missing component). Translating sum(a, b, c) as a + b + c makes net_paid NULL on
      those 86 rows; treating + as if missing were 0 (coalesce) fills gross_paid on them
      (sum(indemnity_amt, expense_amt) gives EUR 72,972.68; from the keyed amounts, as
      Spark's sum would, EUR 367,407.33). Exact translation: gross_paid = indemnity_amt +
      expense_amt (Spark's + is NULL-propagating too); net_paid = NULL when all three are
      NULL, else the sum of the non-NULL ones.
    check: S01_SAS02_plus_vs_sum
  - trap_id: SAS-05
    kind: semantic
    armed: true
    lines: [88, 101]
    where: >-
      merge work.claims(in=c) work.pay_summary(in=p); by claim_id; if c; ... has_payment =
      p; if not p then do; n_payments = 0; n_recoveries = 0; total_paid = 0; recovery_flag
      = 0; end;
    effect: >-
      MERGE BY is a full outer join on claim_id, and the subsetting IF c keeps the rows
      whose claim is on the register. So the 445 claims with no payment up to the as-of
      date are kept (has_payment 0, counts and total_paid 0, the paid split, gross_paid,
      net_paid and the payment dates missing; 4 of them have only payments dated after
      the as-of date), and the 25 payments (EUR 18,740.14) on 25 claim ids missing from the
      register are dropped. An inner join loses the 445 rows; a plain merge (full outer
      join) or a join from the payments side adds 25 rows. Exact translation: claims
      left-join the per-claim payment summary on claim_id, has_payment = whether a summary
      row matched.
    check: S01_SAS05_merge_in_keeps_register_claims
  - trap_id: SAS-06
    kind: semantic
    armed: true
    lines: [35, 79]
    where: >-
      proc sort ... by claim_id _row_seq (line 38), then the work.pay_summary DATA step:
      retain (lines 48-49), first_payment_date = payment_date at first.claim_id (line 60),
      the sum statements n_payments + 1 and total_paid + amount (lines 63-64) and
      n_recoveries + 1 (line 75), last_payment_date = payment_date with output at
      last.claim_id (lines 78-79)
    effect: >-
      The DATA step reads each claim's payments in extract order (_row_seq), which is not
      date order, so first_payment_date and last_payment_date are the dates of the first
      and last payments keyed, not the earliest and latest: they differ from
      min/max(payment_date) on 73 claims (first on 31, last on 46, both on 4). A groupBy
      with min/max, or first()/last() without an ordering, gets them wrong; reproduce them
      ordered by _row_seq (a window, or min_by/max_by on _row_seq). The sum statement
      starts at 0 and skips missing values, so total_paid is 0 on the 5 claims whose
      payments all have no amount, where Spark's sum(amount) is NULL. The totals are
      doubles added in _row_seq order: on 671 claims total_paid differs in the last bits
      (at most 1.5e-11) from the correctly rounded decimal sum, and on 19 from a sum in
      payment-date order (a float_rel comparison absorbs this).
    check: S01_SAS06_first_last_by_extract_order
  - trap_id: SAS-07
    kind: construct
    armed: true
    lines: [46, 79]
    where: >-
      by claim_id; in the work.pay_summary DATA step, with if first.claim_id then do; ...
      end; (line 52) and if last.claim_id then output; (line 79)
    effect: >-
      BY-group processing: the per-claim variables are reset at first.claim_id and one row
      per claim is written at last.claim_id, which becomes a groupBy(claim_id) aggregation
      or a window. Which row is first and last, and the running sums, depend on the
      _row_seq order and are labelled SAS-06; the construct itself does not change results
      on our data. Armed in the construct sense only: present and run.
bugs:
  - bug_id: BUG-08
    lines: [73, 76]
    where: "if amount < 0 then do; recovery_flag = 1; n_recoveries + 1; end;"
    does: >-
      Treats every payment whose amount is missing (not yet keyed) as a recovery, because
      a missing value is smaller than any number in SAS: the 86 unkeyed payments up to
      the as-of date are counted in n_recoveries, which is over-stated on 86 claims (218
      in total against 132 genuine recoveries), and 81 claims carry recovery_flag = 1
      although nothing was recovered on them.
    intended: >-
      Count and flag recoveries only, which come through as negative amounts, as the
      comment says: if . < amount < 0 (or not missing(amount) and amount < 0). A payment
      with no amount yet is not a recovery.
    via_trap: SAS-01
    check: S01_BUG08_missing_amount_counted_as_recovery
