# SQL Server 2022 Developer Edition: the legacy engine for the T-SQL estate (plan §7.3).
#
#   make legacy-up     start it and wait until it is healthy
#   make legacy-down   stop it (the data volume is kept)
#
# The SA password is read from .env (MSSQL_SA_PASSWORD), never written here. SQL Server only
# reads it when the data volume is first created; to change it later, run
#   ALTER LOGIN sa WITH PASSWORD = '...'
# and update .env to match.
#
# The image is pinned by digest to the build the golden outputs were captured on:
# Microsoft SQL Server 2022 RTM-CU27-GDR (KB5126934), 16.0.4305.5. On Apple Silicon it runs
# under Rosetta emulation.
name: lansh

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    platform: linux/amd64
    container_name: lansh-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
    ports:
      - "1433:1433"
    volumes:
      - lansh-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  lansh-sql-data:
    name: lansh-sql-data
